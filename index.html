@keyframes breathe {
    0%, 100% { filter: drop-shadow(0 0 8px rgba(255, 138, 31, .45)); }
    50%      { filter: drop-shadow(0 0 20px rgba(255, 138, 31, .85)); }
}
/* hover / keyboard focus: hot orange glow with a neon-blue rim */
#splash[data-state="ready"] .btn-wrap:hover {
    animation: none;
    filter: drop-shadow(0 0 14px rgba(255, 138, 31, .95)) drop-shadow(0 0 36px rgba(53, 208, 255, .45));
    transform: translateY(-2px);
}
/* same look for keyboard focus (kept as its own rule: browsers without :has() skip it cleanly) */
#splash[data-state="ready"] .btn-wrap:has(.btn:focus-visible) {
    animation: none;
    filter: drop-shadow(0 0 14px rgba(255, 138, 31, .95)) drop-shadow(0 0 36px rgba(53, 208, 255, .45));
}
#splash[data-state="ready"] .btn-wrap:active { transform: translateY(1px) scale(.985); }

/* launching: already pressed */
#splash[data-state="launching"] .btn { cursor: progress; pointer-events: none; }
#splash[data-state="launching"] .btn-wrap { animation: none; filter: drop-shadow(0 0 16px rgba(255, 138, 31, .8)); }

/* ---- full screen option ---- */
.fs {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: clamp(13px, 2vmin, 15px);
    color: var(--ink-dim);
    cursor: pointer;
    transition: color .2s;
}
.fs[hidden] { display: none; }
.fs:hover { color: var(--ink); }
.fs input {
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
}
.fs__box {
    width: 18px;
    height: 18px;
    box-sizing: border-box;
    display: grid;
    place-items: center;
    border: 1.5px solid rgba(255, 255, 255, .35);
    border-radius: 3px;
    transition: border-color .2s;
}
.fs__box::after {
    content: "";
    width: 9px;
    height: 9px;
    border-radius: 1px;
    background: var(--chakra);
    transform: scale(0);
    transition: transform .15s ease;
}
.fs input:checked + .fs__box { border-color: var(--chakra); }
.fs input:checked + .fs__box::after { transform: scale(1); }
.fs input:focus-visible + .fs__box { outline: 2px solid var(--neon); outline-offset: 3px; }

.rotate-hint {
    display: none;
    margin: 18px 0 0;
    font-size: 13px;
    color: var(--chakra-hot);
}
@media (orientation: portrait) and (max-width: 720px) {
    .rotate-hint { display: block; }
}

/* short landscape screens (phones): put the title on one line */
@media (max-height: 460px) {
    .splash__title { font-size: clamp(30px, min(8vmin, 6vw), 60px); }
    .splash__title span { display: inline; }
    .splash__tagline { display: none; }
    .loader { margin-top: 18px; }
}

@media (prefers-reduced-motion: reduce) {
    .ambient__seal,
    .btn-wrap,
    .btn { animation: none !important; }
    .ambient__embers { display: none; }
    #stage,
    .ambient__seal { transition-duration: .01ms !important; transition-delay: 0s !important; }
    .loader.is-indeterminate .loader__fill { animation: none; width: 100%; opacity: .5; }
    #splash { transition-duration: .01ms !important; transition-delay: 0s !important; }
    .game-live #stage::after { animation: none; }
}

    <script type="application/javascript">
    /* =====================================================================
       Splash controller
       loading   -> pygbag is still downloading / unpacking (button disabled)
       ready     -> pygbag printed "Ready to start" and is waiting for a click
       launching -> the click happened, Python is starting the game
       done      -> first frame is on the canvas, splash fades out and is removed

       The click is NOT stopped or cancelled: pygbag listens for that same click
       to unlock browser audio ("media user engagement") and then starts main.py.
       ===================================================================== */
    (function () {
        'use strict';

        // Visible text. Edit here to re-word or translate.
        var TEXT = {
            loading:      'Loading game files\u2026',
            downloading:  'Downloading game files',
            slowLoad:     'Still loading \u2013 a slow connection can take a minute\u2026',
            ready:        'Ready.',
            launching:    'Starting the game\u2026',
            slowLaunch:   'Almost there \u2013 unpacking assets\u2026',
            btnLoading:   'Loading\u2026',
            btnReady:     'Start game',
            btnLaunching: 'Starting\u2026'
        };
        var SLOW_LOAD_MS = 45000, SLOW_LAUNCH_MS = 10000, GIVE_UP_MS = 60000, POLL_MS = 150;
        var FS_KEY = 'eternal-summoners:fullscreen';

        var $ = function (id) { return document.getElementById(id); };
        var splash = $('splash');
        if (!splash) { return; }

        var btn = $('start-btn'), btnLabel = $('start-label');
        var meter = $('splash-meter'), fill = $('splash-fill');
        var statusText = $('status-text'), statusPct = $('status-pct');
        var fsRow = $('fs-row'), fsOpt = $('fs-opt');
        var canvas = $('canvas'), infobox = $('infobox'), prog = $('progress'), embers = $('embers');

        var state = 'loading', finished = false;
        var t0 = Date.now(), tLaunch = 0, pyDoneAt = 0;
        var timer = 0, mo = null;

        /* ---------- small helpers ---------- */
        function setStatus(text, pct) {
            if (statusText.textContent !== text) { statusText.textContent = text; }
            pct = pct || '';
            if (statusPct.textContent !== pct) { statusPct.textContent = pct; }
        }

        function setProgress(f) {                    // f: 0..1, or null = unknown
            if (f === null) {
                meter.classList.add('is-indeterminate');
                meter.removeAttribute('aria-valuenow');
                return;
            }
            f = Math.max(0, Math.min(1, f));
            meter.classList.remove('is-indeterminate');
            fill.style.transform = 'scaleX(' + f + ')';
            meter.setAttribute('aria-valuenow', String(Math.round(f * 100)));
        }

        function readProgress() {                    // pygbag's hidden <progress>, when it reports real numbers
            if (!prog) { return null; }
            var max = +prog.max, val = +prog.value;
            if (!(max > 0) || !(val > 0) || val >= max) { return null; }
            return val / max;
        }

        function engaged() {                         // pygbag's "media user engagement" flag
            try { return !!(window.MM && window.MM.UME); } catch (e) { return false; }
        }

        function gameLive() {                        // pygame.display.set_mode() has resized the 1x1 placeholder canvas
            return !!canvas && canvas.width > 1 && canvas.height > 1;
        }

        function spawnEmbers(n) {
            if (!embers || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) { return; }
            var colors = ['#ff8a1f', '#ffb347', '#ffd27a', '#ff6a1a'], frag = document.createDocumentFragment();
            for (var i = 0; i < n; i++) {
                var el = document.createElement('i'), st = el.style;
                st.setProperty('--x', (Math.random() * 100).toFixed(1) + '%');
                st.setProperty('--s', (1.5 + Math.random() * 3.5).toFixed(1) + 'px');
                st.setProperty('--d', (9 + Math.random() * 12).toFixed(1) + 's');
                st.setProperty('--delay', (-Math.random() * 20).toFixed(1) + 's');
                st.setProperty('--drift', Math.round((Math.random() - 0.5) * 180) + 'px');
                st.setProperty('--c', i % 7 === 0 ? '#35d0ff' : colors[Math.floor(Math.random() * colors.length)]);
                frag.appendChild(el);
            }
            embers.appendChild(frag);
        }

        function goFullscreen() {                    // must run inside the click handler (needs a user gesture)
            var el = document.documentElement;
            var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
            if (!req) { return; }
            try {
                var p = req.call(el);
                if (p && p.catch) { p.catch(function () {}); }
            } catch (e) { /* ignore */ }
        }

        /* ---------- state machine ---------- */
        function setState(next) {
            if (state === next) { return; }
            state = next;
            splash.setAttribute('data-state', next);

            if (next === 'ready') {
                btn.disabled = false;
                btnLabel.textContent = TEXT.btnReady;
                setProgress(1);
                setStatus(TEXT.ready);
                try { btn.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
            } else if (next === 'launching') {
                tLaunch = Date.now();
                btn.setAttribute('aria-busy', 'true');
                btnLabel.textContent = TEXT.btnLaunching;
                setStatus(TEXT.launching);
            }
        }

        function checkReady() {
            if (state !== 'loading' || !infobox) { return; }
            if (/ready to start|click\/touch/i.test(infobox.textContent || '')) { setState('ready'); }
        }

        function start() {
            if (state !== 'ready') { return; }
            try { localStorage.setItem(FS_KEY, fsOpt && fsOpt.checked ? '1' : '0'); } catch (e) { /* ignore */ }
            if (fsOpt && fsOpt.checked && !fsRow.hidden) { goFullscreen(); }
            setState('launching');
        }

        function finish() {
            if (finished) { return; }
            finished = true;
            clearInterval(timer);
            if (mo) { mo.disconnect(); }

            splash.setAttribute('data-state', 'done');
            splash.classList.add('is-leaving');
            document.documentElement.classList.add('game-live');
            try { canvas.focus({ preventScroll: true }); } catch (e) { /* ignore */ }

            var removed = false;
            function cleanup() {
                if (removed) { return; }
                removed = true;
                if (splash.parentNode) { splash.parentNode.removeChild(splash); }
            }
            splash.addEventListener('transitionend', function (e) {
                if (e.target === splash && e.propertyName === 'opacity') { cleanup(); }
            });
            setTimeout(cleanup, 1500);
        }

        function tick() {
            if (finished) { return; }
            var now = Date.now();
            checkReady();

            if (state === 'loading') {
                var f = readProgress();
                if (f !== null) {
                    setProgress(f);
                    setStatus(TEXT.downloading, Math.round(f * 100) + '%');
                } else {
                    setProgress(null);
                    setStatus(now - t0 > SLOW_LOAD_MS ? TEXT.slowLoad : TEXT.loading);
                }
            } else if (state === 'launching' && now - tLaunch > SLOW_LAUNCH_MS) {
                setStatus(TEXT.slowLaunch);
            }

            // Python only gets as far as set_mode() after the engagement click, and it runs the first
            // frame before it yields to the browser, so this poll first sees a sized canvas only once
            // a frame has been drawn.
            var live = engaged() && gameLive();
            var pythonReturned = pyDoneAt && now - pyDoneAt > 800;
            var gaveUp = state === 'launching' && now - tLaunch > GIVE_UP_MS;
            if (live || pythonReturned || gaveUp) { finish(); }
        }

        /* ---------- wire up ---------- */
        function init() {
            spawnEmbers(14);
            setProgress(null);

            if (fsOpt) {
                var fsOk = document.fullscreenEnabled || document.webkitFullscreenEnabled;
                if (!fsOk) {
                    fsRow.hidden = true;                // e.g. iPhone Safari has no fullscreen API for pages
                } else {
                    try { fsOpt.checked = localStorage.getItem(FS_KEY) === '1'; } catch (e) { /* ignore */ }
                }
            }

            // Any click on the splash starts the game (like pygbag's own "click/touch page"),
            // except clicks on the full screen option. Enter/Space on the focused button also lands here.
            splash.addEventListener('click', function (e) {
                if (e.target && e.target.closest && e.target.closest('#fs-row')) { return; }
                start();
            });

            if (infobox && 'MutationObserver' in window) {
                mo = new MutationObserver(function () {
                    checkReady();
                    if (state === 'launching' && !pyDoneAt && infobox.style.display === 'none') { pyDoneAt = Date.now(); }
                });
                mo.observe(infobox, {
                    childList: true, characterData: true, subtree: true,
                    attributes: true, attributeFilter: ['style']
                });
            }

            checkReady();
            timer = setInterval(tick, POLL_MS);
        }

        try {
            init();
        } catch (err) {
            // never leave the player stuck behind the splash because of a script problem
            if (window.console) { console.error('splash failed, hiding it', err); }
            splash.style.display = 'none';
            document.documentElement.classList.add('game-live');   // the stage is hidden until this class is set
        }
    })();
    </script>

    <script type="application/javascript">
    /* =====================================================================
       Stage fitter: keeps the 1100x700 canvas as sharp as the browser allows.
       The canvas has a fixed 1100x700 backing store, so any other on-screen size means resampling.
       - If the best-fitting size is within SNAP of a whole-number zoom (1x, 2x, 3x ... counted in real
         device pixels), the stage snaps to exactly that zoom: every game pixel maps to a whole
         number of screen pixels, nothing is blurred and no stroke is uneven.
       - Otherwise the stage fills the window and the browser resamples. Whole-number-ish or huge
         zooms stay "pixelated"; everything else switches to smooth sampling, which looks cleaner than
         nearest-neighbour at e.g. 1.47x.
       ===================================================================== */
    (function () {
        'use strict';

        var NATIVE_W = 1100;     // W in config.py (pygame.display.set_mode((W, H)))
        var SNAP = 0.10;         // snap down to a whole zoom when within 10% of it. 0 = never snap.

        var stage = document.getElementById('stage');
        if (!stage) { return; }
        var queued = false;

        function fit() {
            queued = false;
            var dpr = window.devicePixelRatio || 1;

            stage.style.removeProperty('--snap-w');                       // measure the natural (fill-the-window) size
            var k = stage.getBoundingClientRect().width * dpr / NATIVE_W; // device pixels per game pixel
            var n = Math.floor(k + 1e-6);
            var crisp;

            if (SNAP > 0 && n >= 1 && k / n - 1 <= SNAP) {
                stage.style.setProperty('--snap-w', (NATIVE_W * n / dpr) + 'px');
                crisp = true;
            } else {
                crisp = Math.abs(k - Math.round(k)) < 0.05 || k >= 3;
            }

            var mode = crisp ? 'crisp' : 'smooth';
            if (stage.getAttribute('data-scale') !== mode) { stage.setAttribute('data-scale', mode); }
        }

        function queue() {
            if (queued) { return; }
            queued = true;
            (window.requestAnimationFrame || setTimeout)(fit);
        }

        window.addEventListener('resize', queue);
        window.addEventListener('orientationchange', queue);
        document.addEventListener('fullscreenchange', queue);
        document.addEventListener('webkitfullscreenchange', queue);
        fit();
    })();
    </script>
