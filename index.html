<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ETERNAL SUMMONERS</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body {
            background-color: #10121c;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #canvas {
            border: 2px solid #ffaa00;
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.4);
            border-radius: 8px;
            max-width: 100vw;
            max-height: 100vh;
            aspect-ratio: 1100 / 700;
            object-fit: contain;
        }
        #status, #progress, #infobox {
            display: none !important;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="1100" height="700" oncontextmenu="event.preventDefault()"></canvas>
    <script async src="du_an_codegame.js"></script>
</body>
</html>
